# Gatsby 5 does not work under Plug'n'Play: its loaders and the sharp and lmdb
# native dependencies expect a real node_modules tree. Yarn 4 defaults to PnP,
# so pin the classic linker.
nodeLinker: node-modules

# Node 26 no longer bundles Corepack, and Corepack cannot be installed here
# (its npm package collides with the Homebrew pnpm shim), so the release is
# committed and yarnPath is what makes `yarn` resolve to 4.9.1 both locally and
# on CI. The global yarn 1.x acts only as the launcher. Deleting this file
# silently drops the project back to yarn 1 and desyncs the lockfile.
yarnPath: .yarn/releases/yarn-4.9.1.cjs
