<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Intent alignment</title>
  <desc id="desc">A minimal browser pointer drawn in ASCII characters on a warm paper background.</desc>
  <rect width="1200" height="630" fill="#f7f4ee"/>
  <g font-family="monospace" font-size="23" fill="#383b34" xml:space="preserve">
    <text x="505" y="110">#</text>
    <text x="505" y="135">##</text>
    <text x="505" y="160">#.#</text>
    <text x="505" y="185">#..#</text>
    <text x="505" y="210">#...#</text>
    <text x="505" y="235">#....#</text>
    <text x="505" y="260">#.....#</text>
    <text x="505" y="285">#......#</text>
    <text x="505" y="310">#.......#</text>
    <text x="505" y="335">#........#</text>
    <text x="505" y="360">#.....#####</text>
    <text x="505" y="385">#..#..#</text>
    <text x="505" y="410">#.# #..#</text>
    <text x="505" y="435">##  #..#</text>
    <text x="505" y="460">#    ##</text>
  </g>
  <text x="600" y="540" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="4" fill="#767267">INTENT ALIGNMENT</text>
</svg>
